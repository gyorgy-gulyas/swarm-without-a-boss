<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Swarm simulator</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <canvas id="map" width="804" height="804"></canvas>
    <aside>
      <h1>Swarm simulator</h1>
      <form id="params">
        <label>Strategy
          <select name="strategy.kind">
            <option value="0">stripes (fixed bands)</option>
            <option value="1" selected>swarm (greedy + lease)</option>
          </select>
        </label>
        <label>Rovers <output></output>
          <input type="range" name="design.rovers" min="1" max="50" step="1" value="25">
        </label>
        <label>Failure rate, 1/h per rover <output></output>
          <input type="range" name="env.failure_rate_per_h" min="0" max="0.05" step="0.0025" value="0.01">
        </label>
        <label>Radio range, m <output></output>
          <input type="range" name="design.radio_range_m" min="20" max="600" step="10" value="300">
        </label>
        <label>Lease, s <output></output>
          <input type="range" name="strategy.lease_s" min="60" max="3600" step="60" value="600">
        </label>
        <label>Deadline, h <output></output>
          <input type="range" name="goal.deadline_h" min="10" max="100" step="1" value="48">
        </label>
        <label>Seed <output></output>
          <input type="range" name="run.seed" min="1" max="100" step="1" value="1">
        </label>
      </form>
      <div class="buttons">
        <button id="play">Play</button>
        <button id="reset">Reset</button>
      </div>
      <label>Speed (simulated minutes per frame) <output id="speedOut"></output>
        <input type="range" id="speed" min="1" max="60" step="1" value="2">
      </label>
      <dl id="stats"></dl>
      <p class="legend">
        <span class="sw bg"></span>not measured
        <span class="sw once"></span>measured once
        <span class="sw dup"></span>measured twice or more<br>
        white: rover · amber: measuring · red ×: failed · lines: radio links · ring: lander
      </p>
    </aside>
  </main>
  <script type="module" src="viewer.js"></script>
</body>
</html>
